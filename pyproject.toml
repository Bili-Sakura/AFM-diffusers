[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-flow-models"
version = "0.2.0"
description = "Adversarial Flow Models and Continuous AFMs with native diffusers integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "diffusers>=0.37.0",
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "transformers>=5.3.0",
  "omegaconf>=2.3.0",
  "timm>=0.9.0",
  "einops",
  "safetensors>=0.4.0",
  "torchmetrics>=1.3.2",
  "torch-fidelity>=0.3.0",
  "wandb>=0.23.0",
  "kornia>=0.8.2",
  "numpy",
  "tqdm",
  "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
