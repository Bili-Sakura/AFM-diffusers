[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-diffusers"
version = "0.1.0"
description = "Diffusers-native Adversarial Flow Models (AFM) and Continuous AFM (CAFM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "diffusers>=0.37.0",
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "transformers>=5.3.0",
  "timm>=0.9.0",
  "safetensors>=0.4.0",
  "einops>=0.7.0",
  "omegaconf>=2.3.0",
  "torchmetrics>=1.3.2",
  "torch-fidelity>=0.3.0",
  "wandb>=0.23.0",
  "kornia>=0.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
